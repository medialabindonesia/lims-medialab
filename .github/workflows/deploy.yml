name: CI/CD

# Satu branch = satu environment di VPS yang sama.
#
#   main           -> production  port 3001  /opt/apps/lims-medialab
#   development    -> development port 3002  /opt/apps/lims-medialab-development
#   marketing-dev  -> marketing   port 3003  /opt/apps/lims-medialab-marketing
#   coa-dev        -> coa         port 3004  /opt/apps/lims-medialab-coa
#
# Tiap environment punya database dan shared/.env sendiri di VPS, jadi tidak
# ada secret tambahan yang perlu disimpan di GitHub.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development, marketing-dev, coa-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-branch: deployment marketing tidak lagi memblokir deployment produksi,
  # tetapi dua deployment ke environment yang sama tetap berurutan.
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, migrate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
          MARIADB_DATABASE: lims_ci
          MARIADB_USER: lims_ci
          MARIADB_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://lims_ci:ci_password@127.0.0.1:3306/lims_ci
      JWT_SECRET: ci-only-secret-not-used-in-production
      NEXT_PUBLIC_SHOW_DEMO_ACCOUNTS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate migrations
        run: pnpm exec prisma migrate deploy

      - name: Build
        run: pnpm build

  resolve:
    name: Resolve target environment
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      env_slug: ${{ steps.map.outputs.env_slug }}
      app_name: ${{ steps.map.outputs.app_name }}
      app_port: ${{ steps.map.outputs.app_port }}
      deploy_path: ${{ steps.map.outputs.deploy_path }}
    steps:
      - name: Map branch to environment
        id: map
        run: |
          case "$GITHUB_REF_NAME" in
            main)
              slug=production;  name=lims-medialab;             port=3001; path=/opt/apps/lims-medialab ;;
            development)
              slug=development; name=lims-medialab-development; port=3002; path=/opt/apps/lims-medialab-development ;;
            marketing-dev)
              slug=marketing;   name=lims-medialab-marketing;   port=3003; path=/opt/apps/lims-medialab-marketing ;;
            coa-dev)
              slug=coa;         name=lims-medialab-coa;         port=3004; path=/opt/apps/lims-medialab-coa ;;
            *)
              echo "Branch '$GITHUB_REF_NAME' tidak dipetakan ke environment mana pun." >&2
              exit 1 ;;
          esac

          {
            echo "env_slug=$slug"
            echo "app_name=$name"
            echo "app_port=$port"
            echo "deploy_path=$path"
          } >> "$GITHUB_OUTPUT"

          echo "Branch $GITHUB_REF_NAME -> environment $slug (port $port)"

  deploy:
    name: Deploy to ${{ needs.resolve.outputs.env_slug }}
    needs: [quality, resolve]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.resolve.outputs.env_slug }}
      url: ${{ vars.APP_URL }}
    env:
      DEPLOY_PATH: ${{ needs.resolve.outputs.deploy_path }}
      APP_NAME: ${{ needs.resolve.outputs.app_name }}
      APP_PORT: ${{ needs.resolve.outputs.app_port }}
      APP_ENV: ${{ needs.resolve.outputs.env_slug }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_USER: ${{ vars.VPS_USER || 'deploy' }}
      VPS_HOST_FINGERPRINT: SHA256:Tvef6HALOMqP74Hd1zXMoTQE5ZJlIVQ7/HgQcfqfbrs
      VPS_DEPLOY_KEY_FINGERPRINT: SHA256:SiNqsXM3YlbQhLL14ZVdWQQdbcw2VW756vc6FJNx+Qo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$APP_NAME" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$APP_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$APP_ENV" =~ ^[a-z0-9-]+$ ]]

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          actual_key_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/deploy_key" | awk 'NR == 1 { print $2 }')"
          if [[ "$actual_key_fingerprint" != "$VPS_DEPLOY_KEY_FINGERPRINT" ]]; then
            echo "Fingerprint private key deployment tidak cocok" >&2
            echo "Expected: $VPS_DEPLOY_KEY_FINGERPRINT" >&2
            echo "Actual:   $actual_key_fingerprint" >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            ssh-keyscan -T 10 -t ed25519 -p "$VPS_PORT" "$VPS_HOST" \
              > "$HOME/.ssh/known_hosts" 2>/dev/null && break
            sleep 2
          done

          test -s "$HOME/.ssh/known_hosts"
          actual_fingerprint="$(ssh-keygen -lf "$HOME/.ssh/known_hosts" | awk 'NR == 1 { print $2 }')"
          if [[ "$actual_fingerprint" != "$VPS_HOST_FINGERPRINT" ]]; then
            echo "Fingerprint VPS tidak cocok" >&2
            echo "Expected: $VPS_HOST_FINGERPRINT" >&2
            echo "Actual:   $actual_fingerprint" >&2
            exit 1
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create release directory
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$GITHUB_SHA'"

      - name: Upload release
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.next/' \
            --exclude='node_modules/' \
            --exclude='.env*' \
            --exclude='graphify-out/' \
            --exclude='storage/uploads/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $VPS_PORT -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/releases/$GITHUB_SHA/"

      - name: Activate release
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash '$DEPLOY_PATH/releases/$GITHUB_SHA/scripts/deploy-vps.sh' '$DEPLOY_PATH/releases/$GITHUB_SHA' '$DEPLOY_PATH' '$GITHUB_SHA' '$APP_NAME' '$APP_PORT' '$APP_ENV'"
